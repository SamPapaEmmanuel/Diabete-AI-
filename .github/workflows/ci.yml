name: Foundation checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: report
          POSTGRES_PASSWORD: local-report-password
          POSTGRES_DB: report_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U report -d report_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv
      REPORT_ENVIRONMENT: test
      REPORT_DATABASE_URL: postgresql+psycopg://report:local-report-password@127.0.0.1:5432/report_test
      TEST_DATABASE_URL: postgresql+psycopg://report:local-report-password@127.0.0.1:5432/report_test
      REPORT_FRONTEND_ORIGIN: http://localhost:5173
      REPORT_MAIL_DIRECTORY: ${{ github.workspace }}/.runtime/mail
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: npm ci
      - run: uv sync --locked --project apps/api
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: uv run --project apps/api ruff format --check apps/api
      - run: uv run --project apps/api ruff check apps/api
      - run: uv run --project apps/api mypy --config-file apps/api/pyproject.toml apps/api/src apps/api/migrations apps/api/tests
      - run: uv run --project apps/api alembic -c apps/api/alembic.ini upgrade head
      - run: uv run --project apps/api pytest apps/api/tests
      - run: uv run --project apps/api alembic -c apps/api/alembic.ini downgrade base
      - run: uv run --project apps/api alembic -c apps/api/alembic.ini upgrade head
      - run: uv run --project apps/api alembic -c apps/api/alembic.ini check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
